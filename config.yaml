# DMX (Enttec DMX USB Pro or Art-Net) -> USB MIDI bridge configuration

input:
  # Which DMX input to use: "usb" (Enttec DMX USB Pro) or "artnet".
  mode: usb
  #mode: artnet
  # If mode is "usb" but the serial port can't be opened, fall back to
  # Art-Net (using the artnet: settings below) instead of exiting.
  fallback_to_artnet: true

serial:
  # Used when input.mode is "usb".
  # Serial device for the Enttec DMX USB Pro (FTDI virtual COM port).
  # Run `python3 dmx_midi_bridge.py --list-serial-ports` to find it.
  port: /dev/ttyUSB0
  # The Widget's baud rate setting is a dummy value (USB speed is fixed),
  # but pyserial still requires one to be specified.
  baudrate: 57600

artnet:
  # Used when input.mode is "artnet".
  # Address to listen on ("0.0.0.0" = all network interfaces).
  bind_address: 0.0.0.0
  port: 6454
  # Art-Net universe number to accept (Net<<8 | SubNet<<4 | Universe).
  universe: 0

midi:
  # "virtual" creates a virtual ALSA MIDI output port that other apps/synths
  # can connect to (good for testing without hardware).
  # Otherwise, set this to a substring of the target MIDI output port name
  # (see `python3 dmx_midi_bridge.py --list-midi-ports`), e.g. "USB MIDI".
  # output: virtual
  # virtual_port_name: "DMX2MIDI"
  output: UM-1
  # If output doesn't match any available port, fall back to a virtual
  # port instead of exiting.
  fallback_to_virtual: true

  # Optional: periodically re-send the current Note On/Off state for every
  # mapped channel, even if it hasn't changed. Useful as a keep-alive for
  # receivers that might miss a message or reset their own state.
  periodic_resend:
    enabled: false
    interval: 1.0   # seconds between resends

# DMX channel -> MIDI note mapping.
# - dmx_channel: 1-512
# - midi_channel: 1-16
# - note: 0-127 (MIDI note number)
# Behavior: when a mapped channel's value changes and is > 0, a Note On is
# sent with velocity scaled from the DMX value (1-255 -> 1-127). When the
# value changes to 0, a Note Off is sent.
#
# Each entry is either a single mapping (dmx_channel/note), or a range
# (dmx_channel_start/dmx_channel_end/note_start) that expands to one
# mapping per channel, with notes assigned consecutively starting at
# note_start. e.g. dmx_channel_start: 1, dmx_channel_end: 16, note_start: 60
# maps channel 1->note 60, channel 2->note 61, ..., channel 16->note 75.
mappings:
  # Full 512-channel coverage, split evenly into 4 blocks of 128 channels
  # each, one per MIDI channel. note_start:0 gives exactly 128 note slots
  # (0-127), matching 128 channels per block with no leftover.
  - dmx_channel_start: 1
    dmx_channel_end: 128
    midi_channel: 1
    note_start: 0   # ch1→note0, ch2→note1, ..., ch128→note127

  - dmx_channel_start: 129
    dmx_channel_end: 256
    midi_channel: 2
    note_start: 0   # ch129→note0, ..., ch256→note127

  - dmx_channel_start: 257
    dmx_channel_end: 384
    midi_channel: 3
    note_start: 0   # ch257→note0, ..., ch384→note127

  - dmx_channel_start: 385
    dmx_channel_end: 512
    midi_channel: 4
    note_start: 0   # ch385→note0, ..., ch512→note127